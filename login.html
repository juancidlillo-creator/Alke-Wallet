<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Login</title>
    <!-- CDN de jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- CDN de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados paleta de colores -->
    <style>
        /* Fondo pantalla color Beige */
        body {
            background-color: #eff6e0 !important;
        }

        /* Texto encabezado: Ink Black  */
        .textoTituloColor {
            color: #01161e;
        }

        /* Botón principal: Dark Teal y hover en Ink Black */
        .botonColor {
            background-color: #124559;
            color: #ffffff;
            border: none;
            transition: all 0.2s ease-in-out;
        }

        .botonColor:hover {
            background-color: #01161e;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(1, 22, 30, 0.2);
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm p-4 bg-white">
                    <h2 class="text-center mb-4 fw-bold tracking-tight textoTituloColor">Inicio de Sesión</h2>

                    <!-- Mensaje de alerta éxito o error -->
                    <div id="alerta" class="alert d-none text-center" role="alert"></div>

                    <form id="formularioLogin">
                        <div class="form-group mb-3">
                            <label for="email" class="form-label fw-semibold text-secondary">Email:</label>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com"
                                required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="password" class="form-label fw-semibold text-secondary">Password:</label>
                            <input type="password" class="form-control" id="password"
                                placeholder="Ingresa tu contraseña" required>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-lg fw-semibold py-2.5 botonColor">Iniciar
                                sesión</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script login -->
    <script>
        // Espera que el HTML este cargado
        $(document).ready(function(){

            // Valores de login
            const emailCorrecto = "juan@gmail.com";
            const contrasenaCorrecta = "123456";


            $("#formularioLogin").submit(function(evento){

                // Evitar que la página se recargue automáticamente
                evento.preventDefault();

                // Valores de los inputs por los ID
                const emailIngresado = $("#email").val();
                const contrasenaIngresada = $("#password").val();


                // Reiniciar estado de la alerta
                $('#alerta').addClass("d-none");
                $('#alerta').removeClass("alert-success");
                $('#alerta').removeClass("alert-danger");
                $('#alerta').text("");

                if (emailIngresado === emailCorrecto && contrasenaIngresada === contrasenaCorrecta) {
                    // Mostrar mensaje de exito
                    $('#alerta').text("Inicio de Sesión Correcto.");
                    $('#alerta').removeClass("d-none");
                    $('#alerta').addClass("alert-success");

                    // Redirigir menu.html después de 2sg
                    setTimeout(function () {window.location.href = "../menu.html";}, 2000);
                } else {
                    // Mostrar mensaje de error
                    $('#alerta').text("Credenciales incorrectas.");
                    $('#alerta').removeClass("d-none");
                    $('#alerta').addClass("alert-danger");
                }
            });

        });
    </script>

</body>

</html>
