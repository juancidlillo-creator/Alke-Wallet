<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Enviar Dinero</title>
    <!-- CDN de jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- CDN de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos personalizados paleta de colores -->
    <style>
        /* Fondo pantalla color Beige */
        body {
            background-color: #eff6e0 !important;
        }

        /* Texto encabezado: Ink Black  */
        .textoTituloColor {
            color: #01161e;
        }

        /* Botón principal: Dark Teal y hover en Ink Black */
        .botonColor{
            background-color: #124559;
            color: #ffffff;
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .botonColor:hover {
            background-color: #01161e;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(1, 22, 30, 0.2);
        }
        
        /* Lista Color: Ash Grey*/
        .listaColor li{
            background-color: #AEC3B0;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm p-4 bg-white">


                    <h2 class="text-center mb-4 fw-bold tracking-tight textoTituloColor">Enviar Dinero</h2>
                    
                    <!-- Mensaje alerta notificaciones -->
                    <div id="alerta" class="alert d-none text-center" role="alert"></div>

                    <div class="form-group mb-3">
                        <label for="searchContact">Buscar en la agenda de transferencias:</label>
                        <input type="text" class="form-control" id="searchContact" placeholder="Buscar contacto">
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="button" id="botonAbrirModal" class="btn btn-lg fw-semibold py-2.5 botonColor">Agregar nuevo contacto</button>
                    </div>
                    

                    <h3 class="text-center mb-4 mt-4 fw-bold tracking-tight textoTituloColor">Contactos</h3>
                    
                    <div class="form-group mb-3">
                        <ul id="contactList" class="list-group listaColor">
                            <li class="list-group-item">
                                <div class="contact-info">
                                    <span class="contact-name">John Doe</span>
                                    <span class="contact-details">CBU: 123456789, Alias: john.doe, Banco: ABC Bank</span>
                                </div>
                            </li>
                            
                            <li class="list-group-item">
                                <div class="contact-info">
                                    <span class="contact-name">Jane Smith</span>
                                    <span class="contact-details">CBU: 987654321, Alias: jane.smith, Banco: XYZ Bank</span>
                                </div>
                            </li>
                        </ul>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="button" id="botonEnviarDinero" class="btn btn-lg fw-semibold py-2.5 botonColor">Enviar dinero</button>
                    </div>
                    
                    <!-- Mensaje de confirmación de envío -->
                    <div id="confirmacionEnvio" class="alert alert-success text-center mt-3 d-none" role="alert"></div>

                    <div class="d-grid gap-2 mt-4">
                        <a href="menu.html" class="btn btn-lg fw-semibold py-2.5 botonColor">Volver al Menú Principal</a>
                    </div>


                </div>
            </div>
        </div>

    </div>

    <!-- Formulario emergente (Modal) -->
    <!--Un formulario emergente (modal) es una ventana de diálogo superpuesta a la página principal que requiere interacción del usuario. Es ideal para captar datos sin redirigir a otra pantalla, bloqueando la navegación hasta que se completa o se cierra.-->
    <div id="modalContacto" class="d-none position-fixed top-0 start-0 w-100 h-100 align-items-center justify-content-center" style="background: rgba(0, 0, 0, 0.5); z-index: 1050;">
        <div class="card p-4 col-11 col-md-8 col-lg-5 shadow-lg bg-white">
            <h4 class="text-center mb-3 fw-bold textoTituloColor">Nuevo Contacto</h4>
            <form id="formularioContacto">
                <div class="mb-3">
                    <label for="nombreContacto" class="form-label fw-semibold text-secondary">Nombre y apellido:</label>
                    <input type="text" class="form-control" id="nombreContacto" required>
                </div>
                <div class="mb-3">
                    <label for="cbuContacto" class="form-label fw-semibold text-secondary">CBU:</label>
                    <input type="text" class="form-control" id="cbuContacto" required>
                </div>
                <div class="mb-3">
                    <label for="aliasContacto" class="form-label fw-semibold text-secondary">Alias:</label>
                    <input type="text" class="form-control" id="aliasContacto" required>
                </div>
                <div class="mb-3">
                    <label for="bancoContacto" class="form-label fw-semibold text-secondary">Nombre del Banco:</label>
                    <input type="text" class="form-control" id="bancoContacto" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success w-50 fw-semibold">Guardar</button>
                    <button type="button" id="botonCancelarContacto" class="btn btn-secondary w-50 fw-semibold">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script envío de dinero y agregar contactos -->
    <script>
        // Espera que el HTML este cargado
        $(document).ready(function () {
            // Variable para guardar el contacto
            let contactoSeleccionado = null;

            // // Mostrar Modal Agregar nuevo contacto
            $("#botonAbrirModal").click(function () {
                $("#modalContacto").removeClass("d-none").addClass("d-flex");
            });

            // Ocultar Modal al cancelar
            $("#botonCancelarContacto").click(function () {
                $("#modalContacto").removeClass("d-flex").addClass("d-none");
                $("#formularioContacto")[0].reset(); // Limpiar campos del formulario
            });

            //Valida el formulario de nuevo contacto
            $("#formularioContacto").submit(function (evento) {
                // Evitar recarga de página
                evento.preventDefault();

                // Campos del formulario
                const nombre = $("#nombreContacto").val().trim();
                const cbu = $("#cbuContacto").val().trim();
                const alias = $("#aliasContacto").val().trim();
                const banco = $("#bancoContacto").val().trim();

                // Valida que los campos no estén vacíos
                if (nombre === "" || cbu === "" || alias === "" || banco === "") {
                    alert("Los campos son obligatorios.");
                    return;
                }

                // Valida el formato de CBU 10 números
                const cbuRegex = /^\d{10}$/;
                if (!cbuRegex.test(cbu)) {
                    alert("El CBU es de 10 números");
                    return;
                }


                // Crea dinámicamente nuevos elementos de contacto
                const nuevoLi = $(`
                    <li class="list-group-item">
                        <div class="contact-info">
                            <span class="contact-name">${nombre}</span><br>
                            <span class="contact-details">CBU: ${cbu}, Alias: ${alias}, Banco: ${banco}</span>
                        </div>
                    </li>
                `);

                // Agrega el contacto a la lista 
                $("#contactList").append(nuevoLi);

                 // Cerrar el modal y limpiar formulario
                $("#modalContacto").removeClass("d-flex").addClass("d-none");
                $("#formularioContacto")[0].reset();
            });

            // Realizar búsqueda dinámica en la agenda 
            $("#searchContact").on("keyup", function () {
                const termino = $(this).val().toLowerCase();

                // Recorrer la lista de contactos
                $("#contactList li").each(function () {
                    const textoContacto = $(this).text().toLowerCase();

                    // Si coincide con el texto, lo muestra; si no, lo oculta
                    if (textoContacto.indexOf(termino) > -1) {
                        $(this).removeClass("d-none");
                    } else {
                        $(this).addClass("d-none");
                    }
                });
            });

            // Seleccion de contacto y  el botón "Enviar dinero"
            $("#contactList").on("click", "li", function () {
                // Quita los bordes
                $("#contactList li").removeClass("border border-dark border-3");

                // Resalta el contacto seleccionado
                $(this).addClass("border border-dark border-3");

                // Guardar la referencia del contacto seleccionado
                contactoSeleccionado = this;

                // Muestra el botón Enviar dinero
                $("#botonEnviarDinero").removeClass("d-none");
            });

            // Evento para Enviar Dinero
            $("#botonEnviarDinero").click(function () {
                // Reinicia alerta
                $("#alerta").addClass("d-none").removeClass("alert-warning alert-danger");

                // Verifica si hay un contacto seleccionado
                if (contactoSeleccionado === null) {
                    $("#alerta").text("Seleccione un contacto primero.");
                    $("#alerta").removeClass("d-none").addClass("alert-warning");
                    return;
                }

                // Obtiene el nombre del contacto 
                const nombreContacto = $(contactoSeleccionado).find(".contact-name").text();

                // Pedir el monto a enviar
                const montoTexto = prompt("Ingrese monto");

                // Si se cancela o deja vacío el prompt
                if (montoTexto === null || montoTexto.trim() === "") {
                    return;
                }

                // Convertir a número
                const montoAEnviar = parseFloat(montoTexto);

                // Validar que el monto sea un número válido y mayor a cero
                if (isNaN(montoAEnviar) || montoAEnviar <= 0) {
                    alert("Ingrese un monto válido o mayor a cero.");
                    return;
                }

                // Recuperar saldo actual
                let saldoActual = localStorage.getItem("saldo");
                if (saldoActual === null) {
                    saldoActual = 777777;
                } else {
                    saldoActual = parseFloat(saldoActual);
                }

                // Verificar si hay suficiente saldo
                if (montoAEnviar > saldoActual) {
                    $("#alerta").text("Saldo insuficiente. Tu saldo actual es de $" + saldoActual);
                    $("#alerta").removeClass("d-none").addClass("alert-danger");
                    return;
                }

                // Calcular el nuevo saldo
                const nuevoSaldo = saldoActual - montoAEnviar;

                // Guardar el nuevo saldo en localStorage
                localStorage.setItem("saldo", nuevoSaldo);

                // Registrar el movimiento en la lista
                let movimientos = localStorage.getItem("movimientos");
                if (movimientos === null) {
                    // Crea lista inicial
                    movimientos = [
                        "Compra en línea - $50.00",
                        "Depósito - $100.00",
                        "Transferencia recibida - $75.00",
                        "Compra en línea - $5550.00",
                        "Depósito misma cuenta - $10500.00",
                        "Transferencia recibida - $7575.00"
                    ];
                } else {
                    // Acceder a la información del local storage, es necesario devolverla a su forma original. Esto lo haces usando el método JSON.parse()
                    movimientos = JSON.parse(movimientos);
                }

                // Agregar la transferencia a la lista
                movimientos.push("Transferencia enviada a " + nombreContacto + " - $" + montoAEnviar.toFixed(2));
                // Guardar la lista actualizada en localStorage
                localStorage.setItem("movimientos", JSON.stringify(movimientos));

                // Mostrar confirmación
                $("#confirmacionEnvio").text("Monto Enviado.");
                $("#confirmacionEnvio").removeClass("d-none");

                // Redirigir menu.html después de 2 sg
                setTimeout(function () {window.location.href = "../menu.html"; }, 2000);
            });
        });
    </script>
</body>
</html>
