<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Enviar Dinero</title>
    <!-- CDN de jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- CDN de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos personalizados paleta de colores -->
    <style>
        /* Fondo pantalla color Beige */
        body {
            background-color: #eff6e0 !important;
        }

        /* Texto encabezado: Ink Black  */
        .textoTituloColor {
            color: #01161e;
        }

        /* Botón principal: Dark Teal y hover en Ink Black */
        .botonColor{
            background-color: #124559;
            color: #ffffff;
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .botonColor:hover {
            background-color: #01161e;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(1, 22, 30, 0.2);
        }
        
        /* Lista Color: Ash Grey*/
        .listaColor li{
            background-color: #AEC3B0;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm p-4 bg-white">


                    <h2 class="text-center mb-4 fw-bold tracking-tight textoTituloColor">Enviar Dinero</h2>
                    
                    <!-- Mensaje alerta notificaciones -->
                    <div id="alerta" class="alert d-none text-center" role="alert"></div>

                    <div class="form-group mb-3">
                        <label for="searchContact">Buscar en la agenda de transferencias:</label>
                        <input type="text" class="form-control" id="searchContact" placeholder="Buscar contacto">
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="button" id="botonAbrirModal" class="btn btn-lg fw-semibold py-2.5 botonColor" data-bs-toggle="modal" data-bs-target="#modalContacto">Agregar nuevo contacto</button>
                    </div>

                    <h3 class="text-center mb-4 mt-4 fw-bold tracking-tight textoTituloColor">Contactos</h3>
                    
                    <div class="form-group mb-3">
                        <ul id="contactList" class="list-group listaColor shadow-sm">
                            <li class="list-group-item" style="cursor: pointer;">
                                <div class="contact-info">
                                    <span class="contact-name fw-semibold">John Doe</span><br>
                                    <span class="contact-details text-muted">CBU: 123456789, Alias: john.doe, Banco: ABC Bank</span>
                                </div>
                            </li>
                            
                            <li class="list-group-item" style="cursor: pointer;">
                                <div class="contact-info">
                                    <span class="contact-name fw-semibold">Jane Smith</span><br>
                                    <span class="contact-details text-muted">CBU: 987654321, Alias: jane.smith, Banco: XYZ Bank</span>
                                </div>
                            </li>
                        </ul>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="button" id="botonEnviarDinero" class="btn btn-lg fw-semibold py-2.5 botonColor">Enviar dinero</button>
                    </div>
                    
                    <!-- Mensaje de confirmación de envío -->
                    <div id="confirmacionEnvio" class="alert alert-success text-center mt-3 d-none" role="alert"></div>

                    <div class="d-grid gap-2 mt-4">
                        <a href="menu.html" class="btn btn-lg fw-semibold py-2.5 botonColor">Volver al Menú Principal</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Formulario emergente (Modal Contacto Bootstrap) -->
    <!--Un formulario emergente (modal) es una ventana de diálogo superpuesta a la página principal que requiere interacción del usuario. Es ideal para captar datos sin redirigir a otra pantalla, bloqueando la navegación hasta que se completa o se cierra.-->
    <div class="modal fade" id="modalContacto" tabindex="-1" aria-labelledby="modalContactoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3 border-0 shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold textoTituloColor" id="modalContactoLabel">Nuevo Contacto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formularioContacto">
                        <div class="mb-3">
                            <label for="nombreContacto" class="form-label fw-semibold text-secondary">Nombre y apellido:</label>
                            <input type="text" class="form-control" id="nombreContacto" required>
                        </div>
                        <div class="mb-3">
                            <label for="cbuContacto" class="form-label fw-semibold text-secondary">CBU (10 números):</label>
                            <input type="text" class="form-control" id="cbuContacto" required>
                        </div>
                        <div class="mb-3">
                            <label for="aliasContacto" class="form-label fw-semibold text-secondary">Alias:</label>
                            <input type="text" class="form-control" id="aliasContacto" required>
                        </div>
                        <div class="mb-3">
                            <label for="bancoContacto" class="form-label fw-semibold text-secondary">Nombre del Banco:</label>
                            <input type="text" class="form-control" id="bancoContacto" required>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-success w-50 fw-semibold py-2">Guardar</button>
                            <button type="button" class="btn btn-secondary w-50 fw-semibold py-2" data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Transferencia de Dinero (Bootstrap) -->
    <div class="modal fade" id="modalTransferencia" tabindex="-1" aria-labelledby="modalTransferenciaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3 border-0 shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold textoTituloColor" id="modalTransferenciaLabel">Realizar Transferencia</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3 text-center bg-light p-3 rounded shadow-sm">
                        <span class="text-secondary fw-semibold">Destinatario:</span>
                        <h5 class="fw-bold mb-0 textoTituloColor" id="transfDestinatario">Nombre</h5>
                        <small class="text-muted" id="transfDetalles">CBU: Alias: Banco:</small>
                    </div>
                    <form id="formularioTransferencia">
                        <div class="mb-3">
                            <label for="montoTransferir" class="form-label fw-semibold text-secondary">Monto a enviar:</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" class="form-control form-control-lg fw-bold text-success" id="montoTransferir" placeholder="0.00" min="0.01" required>
                            </div>
                            <div class="mt-2 text-end">
                                <small class="text-muted">Saldo disponible: <span id="saldoDisponibleTransf" class="fw-bold text-dark">$0.00</span></small>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary w-50 fw-semibold py-2.5 botonColor">Confirmar Envío</button>
                            <button type="button" class="btn btn-secondary w-50 fw-semibold py-2.5" data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Script de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Script envío de dinero y agregar contactos -->
    <script>
        $(document).ready(function () {
            // Variable para guardar el contacto seleccionado
            let contactoSeleccionado = null;

            // Valida el formulario de nuevo contacto
            $("#formularioContacto").submit(function (evento) {
                evento.preventDefault();

                const nombre = $("#nombreContacto").val().trim();
                const cbu = $("#cbuContacto").val().trim();
                const alias = $("#aliasContacto").val().trim();
                const banco = $("#bancoContacto").val().trim();

                if (nombre === "" || cbu === "" || alias === "" || banco === "") {
                    alert("Los campos son obligatorios.");
                    return;
                }

                // Valida el formato de CBU 10 números
                const cbuRegex = /^\d{10}$/;
                if (!cbuRegex.test(cbu)) {
                    alert("El CBU debe contener 10 números.");
                    return;
                }

                // Crea dinámicamente nuevos elementos de contacto
                const nuevoLi = $(`
                    <li class="list-group-item" style="cursor: pointer; display: none;">
                        <div class="contact-info">
                            <span class="contact-name fw-semibold">${nombre}</span><br>
                            <span class="contact-details text-muted">CBU: ${cbu}, Alias: ${alias}, Banco: ${banco}</span>
                        </div>
                    </li>
                `);

                // Agrega el contacto a la lista con animación
                $("#contactList").append(nuevoLi);
                nuevoLi.slideDown(300);

                // Cerrar modal usando API Bootstrap
                const modalContactoEl = document.getElementById('modalContacto');
                const modalContactoInst = bootstrap.Modal.getInstance(modalContactoEl) || new bootstrap.Modal(modalContactoEl);
                modalContactoInst.hide();
                $("#formularioContacto")[0].reset();
            });

            // Realizar búsqueda dinámica en la agenda con animación jQuery
            $("#searchContact").on("keyup", function () {
                const termino = $(this).val().toLowerCase();

                $("#contactList li").each(function () {
                    const textoContacto = $(this).text().toLowerCase();

                    // Si coincide con el texto, lo muestra; si no, lo oculta
                    if (textoContacto.indexOf(termino) > -1) {
                        $(this).slideDown(200);
                    } else {
                        $(this).slideUp(200);
                    }
                });
            });

            // Seleccion de contacto y resaltar
            $("#contactList").on("click", "li", function () {
                $("#contactList li").removeClass("border border-dark border-3 bg-light");
                $(this).addClass("border border-dark border-3 bg-light");
                contactoSeleccionado = this;
            });

            // Evento para Enviar Dinero - Abre formulario modal
            $("#botonEnviarDinero").click(function () {
                // Reinicia alerta
                $("#alerta").addClass("d-none").removeClass("alert-warning alert-danger");

                // Verifica si hay un contacto 
                if (contactoSeleccionado === null) {
                    $("#alerta").text("Seleccione un contacto primero.").removeClass("d-none").addClass("alert-warning").hide().slideDown(300);
                    return;
                }

                // Obtiene detalles del contacto 
                const nombreContacto = $(contactoSeleccionado).find(".contact-name").text();
                const detallesContacto = $(contactoSeleccionado).find(".contact-details").text();

                // Cargar datos en el Modal de Transferencia
                $("#transfDestinatario").text(nombreContacto);
                $("#transfDetalles").text(detallesContacto);

                // Recuperar saldo actual para validación en pantalla
                let saldoActual = localStorage.getItem("saldo");
                if (saldoActual === null) {
                    saldoActual = 777777;
                } else {
                    saldoActual = parseFloat(saldoActual);
                }
                $("#saldoDisponibleTransf").text(saldoActual.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
                $("#montoTransferir").val("");

                // Abrir el modal de Transferencia
                const modalTransf = new bootstrap.Modal(document.getElementById('modalTransferencia'));
                modalTransf.show();
            });

            // Envío de dinero desde el modal de transacción
            $("#formularioTransferencia").submit(function (evento) {
                evento.preventDefault();

                const montoAEnviar = parseFloat($("#montoTransferir").val());

                if (isNaN(montoAEnviar) || montoAEnviar <= 0) {
                    alert("Ingrese un monto válido o mayor a cero.");
                    return;
                }

                let saldoActual = localStorage.getItem("saldo");
                if (saldoActual === null) {
                    saldoActual = 777777;
                } else {
                    saldoActual = parseFloat(saldoActual);
                }

                // Verificar si hay suficiente saldo
                if (montoAEnviar > saldoActual) {
                    alert("Saldo insuficiente. Tu saldo actual es de $" + saldoActual.toLocaleString('es-ES', { minimumFractionDigits: 2 }));
                    return;
                }

                // Cerrar modal de transferencia
                const modalTransfEl = document.getElementById('modalTransferencia');
                const modalTransfInst = bootstrap.Modal.getInstance(modalTransfEl);
                modalTransfInst.hide();

                // Calcular el nuevo saldo
                const nuevoSaldo = saldoActual - montoAEnviar;
                localStorage.setItem("saldo", nuevoSaldo);

                // Registrar el movimiento en la lista
                let movimientos = localStorage.getItem("movimientos");
                if (movimientos === null) {
                    movimientos = [
                        "Compra en línea - $50.00",
                        "Depósito - $100.00",
                        "Transferencia recibida - $75.00",
                        "Compra en línea - $5550.00",
                        "Depósito misma cuenta - $10500.00",
                        "Transferencia recibida - $7575.00"
                    ];
                } else {
                    movimientos = JSON.parse(movimientos);
                }

                const nombreContacto = $(contactoSeleccionado).find(".contact-name").text();
                movimientos.push("Transferencia enviada a " + nombreContacto + " - $" + montoAEnviar.toFixed(2));
                localStorage.setItem("movimientos", JSON.stringify(movimientos));

                // Mostrar confirmación
                $("#confirmacionEnvio").text("Monto de $" + montoAEnviar.toFixed(2) + " enviado con éxito a " + nombreContacto + ".").removeClass("d-none").hide().slideDown(300);

                // Redirigir menu.html después de 2.5 sg
                setTimeout(function () { window.location.href = "menu.html"; }, 2500);
            });
        });
    </script>
</body>
</html>
