<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Menú Principal</title>
    <!-- CDN de jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- CDN de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos personalizados paleta de colores -->
    <style>
        /* Fondo pantalla color Beige */
        body {
            background-color: #eff6e0 !important;
        }

        /* Texto encabezado: Ink Black  */
        .textoTituloColor {
            color: #01161e;
        }

        /* Botón principal: Dark Teal y hover en Ink Black */
        .botonColor{
            background-color: #124559;
            color: #ffffff;
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .botonColor:hover {
            background-color: #01161e;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(1, 22, 30, 0.2);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!--Animacion jQuery fadeIn-->
                <div class="card shadow-sm p-4 bg-white" id="panelMenu" style="display: none;">

                    <h2 class="text-center mb-4 fw-bold tracking-tight textoTituloColor">Menú Principal</h2>

                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <div class="card border-0 shadow-sm text-white" style="background-color: #124559;">
                                <div class="card-body p-4 text-center">
                                    <h6 class="text-uppercase text-white-50 mb-2 fw-semibold">Saldo Disponible</h6>
                                    <h2 class="display-6 fw-bold mb-0">$<span id="saldoActual">0.00</span></h2>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Mensaje alerta de redirección -->
                    <div id="alerta" class="alert alert-info d-none text-center mt-2" role="alert"></div>

                    <nav class="nav nav-pills flex-column gap-2 mt-2">
                        <a id="botonDepositar" class="nav-link text-center fw-semibold py-2.5 botonColor" style="cursor: pointer;">Depositar</a>
                        <a id="botonEnviarDinero" class="nav-link text-center fw-semibold py-2.5 botonColor" style="cursor: pointer;">Enviar Dinero</a>
                        <a id="botonUltimosMovimientos" class="nav-link text-center fw-semibold py-2.5 botonColor" style="cursor: pointer;">Últimos Movimientos</a>
                        <a id="botonSalir" class="nav-link text-center fw-semibold py-2.5 bg-dark text-warning" style="cursor: pointer;" href="login.html">Cerrar Sesión</a>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Boton de menú -->
    <script>
        // Espera que el HTML este cargado
        $(document).ready(function () {

            // Animación al cargar el menú principal
            $("#panelMenu").fadeIn(800);

            // Mostrar saldo al cargar la página
            // El local storage es una funcionalidad de los navegadores que permite a los desarrolladores guardar información en el navegador del usuario. Es parte de Web Storage API [API de Almacenamiento Web] junto a session storage.
            let saldoGuardado = localStorage.getItem("saldo");

            // Si no hay saldo guardado, empieza en 777777
            if (saldoGuardado === null) {
                localStorage.setItem("saldo", "777777");
                saldoGuardado = "777777";
            }

             // Se muestra saldo en pantalla
            $("#saldoActual").text(saldoGuardado);

            // Evento clic en el botón Depositar
            $("#botonDepositar").click(function () {
                // Mensaje de redigir a Enviar Dinero
                $("#alerta").hide().text("Redirigiendo a Depositar.").removeClass("d-none").slideDown(300);

                // Redirigir deposit.html después de 2 sg
                setTimeout(function () { window.location.href = "deposit.html"; }, 2000);
            });

            // Evento al hacer clic en el botón Enviar Dinero
            $("#botonEnviarDinero").click(function () {
                // Mensaje de redigir a Enviar Dinero
                $("#alerta").hide().text("Redirigiendo a Enviar Dinero.").removeClass("d-none").slideDown(300);

                // Redirigir sendmoney.html después de 2 sg
                setTimeout(function () {window.location.href = "sendmoney.html";}, 2000);
            });

            // Evento al hacer clic en el botón Últimos Movimientos
            $("#botonUltimosMovimientos").click(function () {
                // Mensaje de redigir a Últimos Movimientos
                $("#alerta").hide().text("Redirigiendo a últimos movimientos...").removeClass('d-none').slideDown(300);

                // Redirigir transactions.html después de 2 sg
                setTimeout(function () {window.location.href = "transactions.html";}, 2000);
            });
        });
    </script>
</body>
</html>
